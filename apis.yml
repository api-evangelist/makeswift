aid: makeswift
name: Makeswift
description: >-
  Makeswift is a composable visual page builder for marketing teams and
  developers, built for Next.js. It lets marketers visually design, edit, and
  publish modern web frontends while developers register their own React
  components and keep full control over hosting and code. Makeswift ships an
  official React runtime SDK (@makeswift/runtime), a CLI, and a REST API at
  api.makeswift.com for programmatically managing sites, pages, and locales,
  plus a hosted documentation MCP server for AI clients. Makeswift is backed by
  Techstars and partners closely with BigCommerce for composable commerce.
