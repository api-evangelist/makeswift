openapi: 3.2.0
info:
  title: REST Page API
  version: 1.0.0
servers:
- url: https://api.makeswift.com
  description: Production server
tags:
- name: Page
paths:
  /v6/pages:
    post:
      operationId: page_PageController_createV6_v6
      summary: Create Page
      description: Creates a new page in a site.
      tags:
      - Page
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePageV6ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageV6RequestBodyDto'
      security:
      - Authentication: []
    get:
      operationId: page_PageController_listV6_v6
      summary: List Pages
      description: Returns a list of pages for a site.
      tags:
      - Page
      parameters:
      - name: siteId
        in: query
        description: The site ID to list pages from.
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of pages to return.
        required: false
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 20
      - name: startingAfter
        in: query
        description: The pagination cursor. This is used to indicate what ID to list from.
        required: false
        schema:
          type: string
          format: uuid
      - name: pathPrefix
        in: query
        description: The filter that limits pages to only those with a pathname that begins with this value.
        required: false
        schema:
          type: string
          default: /
      - name: sortBy
        in: query
        description: The field to sort pages by.
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesGetParametersSortBy'
          default: path
      - name: sortDirection
        in: query
        description: The sort direction.
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesGetParametersSortDirection'
          default: asc
      - name: includeOffline
        in: query
        description: The flag that determines whether to include offline pages in the results.
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesGetParametersIncludeOffline'
          default: 'false'
      - name: locale
        in: query
        description: The locale code to filter pages by.
        required: false
        schema:
          type: string
      - name: versionRef
        in: query
        description: 'The version reference to retrieve pages from. Defaults to `ref:draft` if not provided.


          Supported formats:

          - `ref:draft` - Draft/working version

          - `ref:live` - Live/published version'
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesGetParametersVersionRef'
          default: ref:draft
      - name: include
        in: query
        description: 'Include additional data in the response. Omit for the page record alone.


          Supported values:

          - `elements` - include each page''s element tree. This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.'
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesGetParametersInclude'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPagesV2ResponseBodyDto'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - Authentication: []
  /v6/pages/{pageIdOrPathname}:
    get:
      operationId: page_PageController_getV6_v6
      summary: Get Page
      description: Returns a page by its ID or pathname.
      tags:
      - Page
      parameters:
      - name: pageIdOrPathname
        in: path
        description: The page ID or pathname for the page you are requesting.
        required: true
        schema:
          type: string
      - name: siteId
        in: query
        description: The site ID required when using a pathname instead of a page ID.
        required: false
        schema:
          type: string
          format: uuid
      - name: versionRef
        in: query
        description: 'The version reference to retrieve the page from. Defaults to `ref:draft` if not provided.


          Supported formats:

          - `ref:draft` - Draft/working version

          - `ref:live` - Live/published version'
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesPageIdOrPathnameGetParametersVersionRef'
          default: ref:draft
      - name: locale
        in: query
        description: The locale to retrieve the page in. Accepts either a locale code (e.g. `en-US`) or a `site_locale` UUID. If provided and resolves to a non-default locale, localized page data is collapsed into the response.
        required: false
        schema:
          type: string
      - name: include
        in: query
        description: 'Include additional data in the response. Omit for the page record alone.


          Supported values:

          - `elements` - include the page''s element tree. This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.'
        required: false
        schema:
          $ref: '#/components/schemas/V6PagesPageIdOrPathnameGetParametersInclude'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPageV6ResponseBodyDto'
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - Authentication: []
    patch:
      operationId: page_PageController_updateV6_v6
      summary: Update Page
      description: Updates an existing page.
      tags:
      - Page
      parameters:
      - name: pageIdOrPathname
        in: path
        description: The page ID or pathname for the page you are updating.
        required: true
        schema:
          type: string
      - name: siteId
        in: query
        description: The site ID required when using a pathname instead of a page ID.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdatePageV6ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
        '404':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFoundResponseDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageV6RequestBodyDto'
      security:
      - Authentication: []
    delete:
      operationId: page_PageController_deleteV6_v6
      summary: Delete Page
      description: Deletes a page.
      tags:
      - Page
      parameters:
      - name: pageIdOrPathname
        in: path
        description: The page ID or pathname for the page you are deleting.
        required: true
        schema:
          type: string
      - name: siteId
        in: query
        description: The site ID required when using a pathname instead of a page ID.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The response that indicates success when the page is deleted.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: Access forbidden.
          content:
            application/json:
              schema:
                description: Any type
      security:
      - Authentication: []
components:
  schemas:
    ListPagesV2ResponseBodyDto:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/ListPagesV2ResponseBodyDtoObject'
        data:
          type: array
          items:
            $ref: '#/components/schemas/ListPagesV2ResponseBodyDtoDataItems'
        hasMore:
          type: boolean
          description: The flag that indicates whether there are more pages available.
      required:
      - object
      - data
      - hasMore
      title: ListPagesV2ResponseBodyDto
    NotFoundResponseDto:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/NotFoundResponseDtoObject'
        code:
          $ref: '#/components/schemas/NotFoundResponseDtoCode'
        message:
          type: string
      required:
      - object
      - code
      - message
      title: NotFoundResponseDto
    UpdatePageV6RequestBodyDto:
      type: object
      properties:
        pathname:
          type: string
          description: The page pathname.
        name:
          type: string
          minLength: 1
          description: The page name.
        isOnline:
          type: boolean
          description: The flag that indicates whether the page is online.
        elements:
          $ref: '#/components/schemas/UpdatePageV6RequestBodyDtoElements'
          description: The root of the page's element tree. When present, replaces the tree in full. This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.
      title: UpdatePageV6RequestBodyDto
    GetPageV6ResponseBodyDtoElements:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GetPageV6ResponseBodyDtoElementsType'
        key:
          type: string
          format: uuid
          description: A UUID, unique within this tree.
        props:
          type: object
          additionalProperties:
            description: Any type
          description: Control-defined values, keyed by prop name. Nested elements appear here too, as a { elements, columns } value that may sit under any prop name and at any depth - there is no reserved prop name for children.
      required:
      - type
      - key
      - props
      description: The root of the page's element tree. `null` unless `include=elements`.
      title: GetPageV6ResponseBodyDtoElements
    ForbiddenResponseDtoCode:
      type: string
      enum:
      - forbidden
      title: ForbiddenResponseDtoCode
    ListPagesV2ResponseBodyDtoDataItemsElementsType:
      type: string
      enum:
      - ./components/Root/index.js
      title: ListPagesV2ResponseBodyDtoDataItemsElementsType
    V6PagesPageIdOrPathnameGetParametersVersionRef:
