      title: V6PagesPageIdOrPathnameGetParametersVersionRef
    CreatePageV6RequestBodyDto:
      type: object
      properties:
        siteId:
          type: string
          format: uuid
          description: The site ID to create the page for.
        pathname:
          type: string
          description: The page pathname.
        name:
          type: string
          minLength: 1
          description: The page name.
        elements:
          $ref: '#/components/schemas/CreatePageV6RequestBodyDtoElements'
          description: The root of the page's element tree. When omitted, the page starts with an empty root. This feature is in beta and may change. Requests return `403` until the feature flag is enabled for your site or workspace.
      required:
      - siteId
      - pathname
      - name
      title: CreatePageV6RequestBodyDto
    V6PagesGetParametersSortDirection:
      type: string
      enum:
      - asc
      - desc
      default: asc
      title: V6PagesGetParametersSortDirection
    GetPageV6ResponseBodyDtoObject:
      type: string
      enum:
      - page
      title: GetPageV6ResponseBodyDtoObject
    V6PagesGetParametersInclude:
      type: string
      enum:
      - elements
      title: V6PagesGetParametersInclude
    CreatePageV6RequestBodyDtoElementsType:
      type: string
      enum:
      - ./components/Root/index.js
      title: CreatePageV6RequestBodyDtoElementsType
    BadRequestResponseDtoCode:
      type: string
      enum:
      - bad_request
      title: BadRequestResponseDtoCode
    GetPageV6ResponseBodyDto:
      type: object
      properties:
        object:
          $ref: '#/components/schemas/GetPageV6ResponseBodyDtoObject'
        id:
          type: string
          format: uuid
          description: The ID of the page.
        pathname:
          type: string
          description: The page pathname.
        canonicalUrl:
          type:
          - string
          - 'null'
          description: The canonical URL of the page.
        title:
          type:
          - string
          - 'null'
          description: The page title.
        description:
          type:
          - string
          - 'null'
          description: The page description.
        socialImageUrl:
          type:
          - string
          - 'null'
          description: The social image URL of the page.
        sitemapPriority:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          maximum: 1
          description: The sitemap priority.
        sitemapFrequency:
          oneOf:
          - $ref: '#/components/schemas/GetPageV6ResponseBodyDtoSitemapFrequency'
          - type: 'null'
          description: The sitemap update frequency.
        createdAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The page creation date and time.
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The page last update date and time.
        publishedAt:
          type:
          - string
          - 'null'
          format: date-time
          description: The page publication date and time.
        isOnline:
          type: boolean
          description: The flag that indicates whether the page is online.
        excludedFromSearchEngines:
          type:
          - boolean
          - 'null'
          description: The flag that indicates whether the page is excluded from search.
        locale:
          type: string
          description: The page locale. This defaults to the default locale of the parent site.
        localizations:
          type: array
          items:
            $ref: '#/components/schemas/GetPageV6ResponseBodyDtoLocalizationsItems'
          description: The localizations of the page.
        elements:
          oneOf:
          - $ref: '#/components/schemas/GetPageV6ResponseBodyDtoElements'
          - type: 'null'
          description: The root of the page's element tree. `null` unless `include=elements`.
      required:
      - object
      - id
      - pathname
      - canonicalUrl
      - title
      - description
      - socialImageUrl
      - sitemapPriority
      - sitemapFrequency
      - createdAt
      - updatedAt
      - publishedAt
      - isOnline
      - excludedFromSearchEngines
      - localizations
      - elements
      title: GetPageV6ResponseBodyDto
    UpdatePageV6RequestBodyDtoElementsType:
      type: string
      enum:
      - ./components/Root/index.js
      title: UpdatePageV6RequestBodyDtoElementsType
    UpdatePageV6ResponseBodyDtoSitemapFrequency:
      type: string
      enum:
      - always
      - hourly
      - daily
      - weekly
      - monthly
      - yearly
      - never
      description: The sitemap update frequency.
      title: UpdatePageV6ResponseBodyDtoSitemapFrequency
    NotFoundResponseDtoCode:
      type: string
      enum:
      - not_found
      title: NotFoundResponseDtoCode
    ListPagesV2ResponseBodyDtoObject:
      type: string
      enum:
      - list
      title: ListPagesV2ResponseBodyDtoObject
    CreatePageV6ResponseBodyDtoLocalizationsItems:
      type: object
      properties:
        locale:
          type: string
          description: The locale of the localization.
        pathname:
          type: string
          description: The pathname of the localization.
        id:
