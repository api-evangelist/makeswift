          - 'null'
      title: CreateTypographyV4BodyDtoStyleItemsValueFontSize
    TypographyV4ResponseDtoStyleItemsValueFontSize:
      oneOf:
      - type: boolean
      - type: number
        format: double
      - type: string
      - description: Any type
      title: TypographyV4ResponseDtoStyleItemsValueFontSize
    ListTypographiesV4ResponseDtoDataItemsStyleItems:
      type: object
      properties:
        deviceId:
          type: string
        value:
          $ref: '#/components/schemas/ListTypographiesV4ResponseDtoDataItemsStyleItemsValue'
      required:
