          description: The "id" or "referenceId" of an existing swatch (create one with the Swatch API first). Omit or null it for no swatch.
        alpha:
          type:
          - number
          - 'null'
          format: double
          description: Opacity between 0 and 1.
      title: UpdateTypographyV4BodyDtoStyleItemsValueColor
