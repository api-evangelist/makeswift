openapi: 3.2.0
info:
  title: REST Site API
  version: 1.0.0
servers:
- url: https://api.makeswift.com
  description: Production server
tags:
- name: Site
paths:
  /v2/sites:
    post:
      operationId: site_SiteController_createV2_v2
      summary: Create Site
      description: Creates a new site in a workspace.
      tags:
      - Site
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateSiteV2ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteV2RequestBodyDto'
      security:
      - Authentication: []
    get:
      operationId: site_SiteController_listV2_v2
      summary: List Sites
      description: Returns a list of sites in a workspace.
      tags:
      - Site
      parameters:
      - name: workspaceId
        in: query
        description: The workspace ID to list sites from.
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: The maximum number of sites to return.
        required: false
        schema:
          type: number
          format: double
          minimum: 1
          maximum: 100
          default: 20
      - name: startingAfter
        in: query
        description: The pagination cursor. This is used to indicate what ID to list from.
        required: false
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListSiteV2ResponseBodyDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      security:
      - Authentication: []
  /v2/sites/{siteId}:
    get:
      operationId: site_SiteController_getOneV2_v2
      summary: Get Site
      description: Returns a site by its ID.
      tags:
      - Site
      parameters:
      - name: siteId
        in: path
        description: The site ID for the site you are requesting.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadSiteV2ResponseBodyDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      security:
      - Authentication: []
    patch:
      operationId: site_SiteController_updateOneV2_v2
      summary: Update Site
      description: Updates an existing site.
      tags:
      - Site
      parameters:
      - name: siteId
        in: path
        description: The site ID for the site you are updating.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateSiteV2ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteV2RequestBodyDto'
      security:
      - Authentication: []
    delete:
      operationId: site_SiteController_deleteV2_v2
      summary: Delete Site
      description: Deletes a site.
      tags:
      - Site
      parameters:
      - name: siteId
        in: path
        description: The site ID for the site you are deleting.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Site successfully deleted.
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      security:
      - Authentication: []
  /v2/sites/{siteId}/duplicate:
    post:
      operationId: site_SiteController_duplicateV2_v2
      summary: Duplicate Site
      description: Duplicates an existing site with all its content and configuration.
      tags:
      - Site
      parameters:
      - name: siteId
        in: path
        description: The site ID for the site you are duplicating.
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '201':
          description: Returns the newly created duplicated site.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateSiteV2ResponseBodyDto'
        '400':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequestResponseDto'
        '403':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenResponseDto'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateSiteV2RequestBodyDto'
      security:
      - Authentication: []
components:
  schemas:
    ListSiteV2ResponseBodyDtoObject:
      type: string
      enum:
